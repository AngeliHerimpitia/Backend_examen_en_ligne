<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        html {
            scroll-behavior: smooth;
        }
        section {
            margin-top: -20px;
            width: 100%;
            text-align: center;
            height: 600px;
            background-color: black;
            color: white;
        }
        h1 {
            position: relative;
            top: 50%;
        }
        body {
            margin: 0;
            padding: 0;
        }
        .header {
            display: flex;
            background-color: red;   
            padding: 5px;
            height: 40px;
            width: 100%;
            position: fixed;
            padding-left: 60px;
        }
        ul  {
            display: flex;
            padding: 5px;
            text-align: center;
            gap: 30%;
            font-style: none;
        }
        h1 {
            font-size: 30px;
        }
        li {
            font-style: none;
            color: black;
        }
        a {
            font-style: none;
            color: black;
            font-style: normal;
        }
    </style>
</head>
<body>
    <div class="header">
        <ul>
            <li ><a href="#Je">Je</a></li>
            <li><a href="#t'aime">T'aime</a></li>
            <li><a href="#Mon">Mon</a></li>
            <li><a href="#Amour">Amour</a></li>
            <li><a href="#Solange">Solange</a></li>
        </ul>
    </div>
    <section id="Je"><h1>JE</h1></section>
    <section id="t'aime"><h1>T'aime</h1></section>
    <section id="Mon"><h1>Mon</h1></section>
    <section id="Amour"><h1>Amour</h1></section>
    <section id="Solange"><h1>Solange</h1></section>
    
</body>
</html>
